<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Head -->
  <rect x="30" y="25" width="40" height="50" rx="8" fill="#2563eb"/>
  
  <!-- Headphones - left side -->
  <rect x="20" y="45" width="10" height="3" fill="#1e40af"/>
  <circle cx="17" cy="50" r="8" fill="#1e40af" stroke="#000000" stroke-width="2"/>
  <circle cx="17" cy="50" r="4" fill="#000000"/>
  
  <!-- Headphones - right side -->
  <rect x="70" y="45" width="10" height="3" fill="#1e40af"/>
  <circle cx="83" cy="50" r="8" fill="#1e40af" stroke="#000000" stroke-width="2"/>
  <circle cx="83" cy="50" r="4" fill="#000000"/>
  
  <!-- Eyes (white only, no pupils) -->
  <circle cx="40" cy="45" r="6" fill="#ffffff"/>
  <circle cx="60" cy="45" r="6" fill="#ffffff"/>
  
  <!-- Smirk -->
  <path d="M 40 62 Q 50 67 60 62" stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
