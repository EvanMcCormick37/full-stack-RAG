<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for shadow -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Main body -->
  <rect x="30" y="5" width="140" height="100" rx="18" ry="18" fill="none" stroke="#000000" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Left eye white -->
  <ellipse cx="55" cy="55" rx="24" ry="26" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  
  <!-- Right eye white -->
  <ellipse cx="145" cy="55" rx="24" ry="26" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  
  <!-- Left pupil (looking left, tangent to outer edge) -->
  <ellipse cx="41" cy="55" rx="10" ry="12" fill="#000000"/>
  
  <!-- Right pupil (looking right, tangent to outer edge) -->
  <ellipse cx="159" cy="55" rx="10" ry="12" fill="#000000"/>
  
</svg>
