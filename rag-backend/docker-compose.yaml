services:
  # Main RAG Backend Service
  rag-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-backend
    ports:
      - "8000:8000"
    environment:
      # Sensitive Data
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    # Blind-mount volumes from my VM for persistent data storage
    volumes:
      # Persist vector database
      - ./chroma-data:/app/chroma
    healthcheck:
      disable: false
    networks:
      - rag-network
    restart: unless-stopped

# Network for service communication
networks:
  rag-network:
    driver: bridge